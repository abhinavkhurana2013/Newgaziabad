<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle with Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="20" filter="url(#shadow)" />
  
  <!-- Subtle Inner Ring -->
  <rect x="44" y="44" width="424" height="424" rx="92" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.3" />

  <!-- Crown Icon -->
  <g filter="url(#shadow)">
    <!-- Crown Base -->
    <path d="M128 320 L384 320 L368 356 L144 356 Z" fill="url(#goldGrad)" />
    
    <!-- Crown Jewels on Base -->
    <circle cx="184" cy="338" r="8" fill="#ffffff" />
    <circle cx="256" cy="338" r="10" fill="#ef4444" />
    <circle cx="328" cy="338" r="8" fill="#ffffff" />

    <!-- Crown Peaks -->
    <path d="M128 304 
             L112 176 
             L192 248 
             L256 136 
             L320 248 
             L400 176 
             L384 304 Z" 
          fill="url(#goldGrad)" />

    <!-- Crown Tip Jewels -->
    <circle cx="112" cy="168" r="14" fill="#fbbf24" stroke="#78350f" stroke-width="3" />
    <circle cx="192" cy="240" r="11" fill="#fef08a" stroke="#78350f" stroke-width="3" />
    <circle cx="256" cy="126" r="18" fill="#ffffff" stroke="#d97706" stroke-width="4" />
    <circle cx="320" cy="240" r="11" fill="#fef08a" stroke="#78350f" stroke-width="3" />
    <circle cx="400" cy="168" r="14" fill="#fbbf24" stroke="#78350f" stroke-width="3" />
  </g>

  <!-- Text / Badge: FAST -->
  <g filter="url(#shadow)">
    <rect x="136" y="380" width="240" height="52" rx="26" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" />
    <text x="256" y="416" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="4">FAST</text>
  </g>
</svg>
