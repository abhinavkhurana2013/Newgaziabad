<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="logoClip">
      <rect x="16" y="16" width="480" height="480" rx="96" ry="96" />
    </clipPath>
  </defs>

  <!-- Outer Golden Border and Navy Blue Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#07193f" stroke="#fcb813" stroke-width="22" stroke-linejoin="round" />

  <!-- Crown above the 'G' -->
  <g transform="translate(290, 48) rotate(12)">
    <!-- Crown Base & Prongs -->
    <path d="M 12 68 L 38 32 L 64 56 L 90 24 L 116 56 L 142 32 L 168 68 Z" fill="#fcb813" stroke="#fcb813" stroke-width="4" stroke-linejoin="round" />
    <path d="M 12 68 C 50 78, 130 78, 168 68 L 164 80 C 126 90, 54 90, 16 80 Z" fill="#fcb813" />
    <!-- Crown Jewel Circles -->
    <circle cx="38" cy="28" r="9" fill="#fcb813" />
    <circle cx="90" cy="20" r="11" fill="#fcb813" />
    <circle cx="142" cy="28" r="9" fill="#fcb813" />
  </g>

  <!-- Large Monogram 'NG' -->
  <g id="monogram">
    <!-- Letter N in Solid White -->
    <path d="M 86 132 L 148 132 L 202 240 L 202 132 L 250 132 L 250 300 L 190 300 L 134 190 L 134 300 L 86 300 Z" fill="#ffffff" />
    
    <!-- Letter G in Solid Gold -->
    <!-- Custom bold G geometry matching brand -->
    <path d="M 370 130 C 430 130, 442 166, 442 176 L 392 186 C 390 174, 376 166, 356 166 C 314 166, 290 200, 290 220 C 290 248, 316 266, 360 266 C 382 266, 396 258, 400 242 L 358 242 L 358 212 L 444 212 L 444 268 C 426 292, 396 302, 354 302 C 286 302, 240 264, 240 216 C 240 162, 292 130, 370 130 Z" fill="#fcb813" />
  </g>

  <!-- Text: NEW GAZIABAD -->
  <text x="256" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">NEW GAZIABAD</text>

  <!-- Text & Lines: — RESULTS — -->
  <!-- Left horizontal line -->
  <rect x="62" y="420" width="64" height="7" rx="3.5" fill="#fcb813" />
  <!-- Center RESULTS text -->
  <text x="256" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', Arial, sans-serif" font-size="36" font-weight="900" fill="#fcb813" text-anchor="middle" letter-spacing="4">RESULTS</text>
  <!-- Right horizontal line -->
  <rect x="386" y="420" width="64" height="7" rx="3.5" fill="#fcb813" />
</svg>

